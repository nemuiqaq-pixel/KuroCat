name: Build KuroCat with Team Mode

# 触发：推送到 main/master 分支 或 手动触发
on:
  push:
    branches: [main, master]
    paths:
      - 'windows/src/**'
      - 'windows/CMakeLists.txt'
      - '.github/workflows/build.yml'
  workflow_dispatch:  # 支持手动点按钮触发

jobs:
  build-windows:
    name: Build KuroCat.exe (x64, Release)
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSVC + CMake
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          msvc-version: '17.10'  # VS 2022
          arch: x64

      - name: Configure CMake
        working-directory: windows
        run: cmake -B build -S . -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        working-directory: windows
        run: cmake --build build --config Release

      - name: Collect artifacts
        id: collect
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "windows\build\Release" -Filter "KuroCat.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { throw "KuroCat.exe not found!" }
          Write-Host "Found: $($exe.FullName) ($([math]::Round($exe.Length/1MB, 2)) MB)"
          New-Item -ItemType Directory -Force -Path "artifacts" | Out-Null
          Copy-Item $exe.FullName "artifacts\KuroCat-Team.exe"
          $size = [math]::Round($exe.Length/1MB, 2)
          Write-Host "exe_size=$size" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KuroCat-Team-Windows-x64
          path: artifacts/KuroCat-Team.exe
          retention-days: 30

      - name: Create GitHub Release (git tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/KuroCat-Team.exe
          body: |
            ## KuroCat with Team Mode — ${{ github.ref_name }}
            - 保留全部原版功能
            - 新增「组队模式」：托盘右键菜单开启
            - `KuroCat.exe --server=wss://... --room=office --name=张三`
