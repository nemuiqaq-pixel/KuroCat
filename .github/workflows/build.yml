name: Build KuroCat with Team Mode

on:
  push:
    branches: [main, master]
    paths:
      - 'windows/src/**'
      - 'windows/CMakeLists.txt'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build KuroCat.exe (x64, Release)
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSVC + CMake + Ninja
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Configure CMake (Ninja)
        working-directory: windows
        run: cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build KuroCat.exe
        working-directory: windows
        run: cmake --build build

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts" | Out-Null
          $kurocat = Get-ChildItem -Path "windows\build" -Filter "KuroCat.exe" -Recurse | Select-Object -First 1
          if (-not $kurocat) { throw "KuroCat.exe not found!" }
          Copy-Item $kurocat.FullName "artifacts\KuroCat-Team.exe"
          Write-Host "Found KuroCat: $($kurocat.FullName) ($([math]::Round($kurocat.Length/1MB, 2)) MB)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KuroCat-Team-Windows-x64
          path: artifacts/KuroCat-Team.exe
          retention-days: 30
